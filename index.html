<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Bidire News AI Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,"Noto Sans Kannada",sans-serif}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{font-weight:800;color:#b40000;font-size:19px}.sub{font-size:11px;color:#777}.wrap{max-width:980px;margin:12px auto;padding:0 9px}
.panel{background:#fff;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;overflow:hidden}.bar{padding:9px 11px;border-bottom:1px solid #eee;font-weight:700;background:#fafafa}.body{padding:11px}
textarea,input,select{width:100%;border:1px solid #ccc;border-radius:6px;padding:9px;font:inherit}textarea{min-height:170px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;margin:7px 0 4px}.row,.actions{display:flex;gap:7px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}.actions{margin-top:9px}.actions button{flex:1;min-width:115px}
button{border:0;border-radius:6px;padding:9px 11px;font-weight:700}.primary{background:#b40000;color:#fff}.black{background:#111;color:#fff}.light{background:#eee}
.status{display:none;margin-top:8px;padding:8px;border-left:3px solid #b40000;background:#fff7d6;font-size:12px}.small{font-size:11px;color:#777}
.post-preview{border:1px solid #ddd;border-radius:8px;background:#fff;padding:16px}.post-preview h1{font-size:26px;line-height:1.35;margin:0 0 8px}
.post-sub{font-size:15px;font-weight:600;line-height:1.55;color:#555;margin:0 0 15px;padding:7px 10px;border-left:3px solid #aaa;background:#f7f7f7}
.post-body p{margin:0 0 12px;line-height:1.75}.post-photo{margin:14px 0 18px;text-align:center}.post-photo img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:4px}
.post-photo figcaption{font-size:12px;font-style:italic;color:#666;margin-top:5px;line-height:1.4}
.photo-box{margin-top:10px;border:1px dashed #ccc;border-radius:8px;padding:10px;background:#fafafa}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:9px}.photo-item{border:1px solid #ddd;border-radius:7px;overflow:hidden;background:#fff}
.photo-item img{display:block;width:100%;height:120px;object-fit:cover}.photo-item .pcap{padding:6px 8px;font-size:11px;color:#666;font-style:italic;line-height:1.35}
.photo-item .pname{padding:5px 8px;font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.photo-remove{margin:6px 8px 8px;width:calc(100% - 16px);font-size:11px}
.hide{display:none}.summary-box{margin:18px 0;padding:13px 15px;border-left:4px solid #b40000;background:#fff4ef;border-radius:4px}.summary-box h3{margin:0 0 8px;font-size:19px}
.summary-box ul{margin:0;padding-left:20px}.summary-box li{margin:5px 0;line-height:1.55}.english-box{border-left-color:#555;background:#f7f7f7}.english-box p{margin:0!important;font-size:15px;line-height:1.65!important;color:#444}
@media(max-width:600px){header{padding:9px 8px}.brand{font-size:17px}.sub{font-size:10px}.actions button{min-width:100px;padding:8px}.post-preview h1{font-size:22px}}
html[data-theme="dark"] body{background:#0d1117;color:#e6edf3}html[data-theme="dark"] header{background:#0d1117;border-bottom-color:#30363d}
html[data-theme="dark"] .panel,html[data-theme="dark"] .post-preview{background:#161b22;border-color:#30363d}
html[data-theme="dark"] .bar{background:#11161d;border-bottom-color:#30363d}.dark-in{background:#0d1117!important;color:#e6edf3!important;border-color:#484f58!important}
</style>
</head>
<body>
<header>
  <div><div class="brand">Bidire News</div><div class="sub">AI News Editor</div></div>
  <div class="actions" style="margin:0">
    <button id="newBtn" class="primary">＋ New Post</button>
    <button id="themeBtn" class="light">☀️ Light</button>
    <button id="settingsBtn" class="black">⚙ Settings</button>
  </div>
</header>

<main class="wrap">
<section class="panel"><div class="bar">ಹೊಸ ಸುದ್ದಿ</div><div class="body">
<label>Raw News / ಮೂಲ ಮಾಹಿತಿ</label>
<textarea id="raw" placeholder="ಕಚ್ಚಾ ಸುದ್ದಿಯನ್ನು ಇಲ್ಲಿ paste ಮಾಡಿ..."></textarea>

<div class="photo-box">
<strong style="font-size:13px">📷 Photo + Automatic Caption</strong>
<label>📷 Photos / ಫೋಟೋಗಳು</label>
<input id="photoInput" type="file" accept="image/*" multiple>
<div class="small">ಫೋಟೋ ಆಯ್ಕೆ ಮಾಡಿದ ನಂತರ ಸಿದ್ಧವಾದ ಸುದ್ದಿಯ ಆಧಾರದ ಮೇಲೆ caption automatic ಆಗಿ ತಯಾರಾಗುತ್ತದೆ.</div>
<div id="photoGrid" class="photo-grid"></div><div id="photoStatus" class="small"></div>
</div>

<div class="row">
<div><label>ಪದಗಳ ಮಿತಿ</label><select id="limit"><option value="0">Original</option><option>100</option><option>150</option><option>170</option><option>200</option></select></div>
<div><label>ಶೈಲಿ</label><select id="style"><option value="normal">Bidire News</option><option value="vijayavani">ವಿಜಯವಾಣಿ ಶೈಲಿ</option></select></div>
</div>
<div class="actions">
<button class="primary" id="generate">✨ AI ಸುದ್ದಿ ಬರೆಯಿರಿ</button><button class="light" id="shorten">✂ ಸಂಕ್ಷಿಪ್ತ</button><button class="light" id="grammar">✓ Grammar</button><button class="light" id="translate">English</button>
</div>
<div id="status" class="status"></div>
</div></section>

<section class="panel"><div class="bar">ಸುದ್ದಿ ಸಂಪಾದನೆ</div><div class="body">
<label>Headline</label><input id="headline">
<label>Subheadline / ಉಪಶೀರ್ಷಿಕೆ</label><input id="sub">
<label>News Body</label><textarea id="bodyOut" style="min-height:260px"></textarea>
<div class="actions"><button class="primary" id="publish">🚀 Publish to Blogger</button><button class="black" id="copy">📋 Copy to Blogger</button><button class="light" id="save">💾 Save Draft</button></div>
<div id="publishStatus" class="status"></div>
</div></section>

<section class="panel"><div class="bar">📰 News Post Preview</div><div class="body">
<div class="post-preview" id="preview">
<h1 id="ph">ಶೀರ್ಷಿಕೆ</h1><div id="ps" class="post-sub">ಸಬ್‌ಹೆಡ್ಲೈನ್ ಇಲ್ಲಿ ಕಾಣಿಸುತ್ತದೆ.</div>
<div id="pbody" class="post-body">ನಿಮ್ಮ ಸುದ್ದಿ ಇಲ್ಲಿ ಕಾಣಿಸುತ್ತದೆ.</div>
</div>
</div></section>

<section class="panel hide" id="settings"><div class="bar">Gemini + Blogger Settings</div><div class="body">
<label>Gemini API Key</label><input id="apiKey" type="password" placeholder="AIza...">
<label>Gemini Model</label><select id="model"><option value="gemini-3.8-flash">Gemini 3.8 Flash</option><option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option></select>
<label>Google OAuth Client ID</label><input id="clientId" placeholder="xxxxx.apps.googleusercontent.com">
<label>Blogger Blog ID</label><input id="blogId" value="2799540703054854619">
<label>Default Blogger Label</label><input id="blogLabel">
<div class="actions"><button class="primary" id="saveSettings">Save Settings</button><button class="black" id="connect">🔐 Connect Google / Blogger</button><button class="light" id="disconnect">Disconnect</button></div>
<div id="settingsStatus" class="small"></div><div id="bloggerStatus" class="small"></div>
</div></section>
</main>

<script>
const $=id=>document.getElementById(id);
let photos=[], keyPoints=[], englishSummary="", token=null, tokenClient=null, pending=null;
const blogDefault="2799540703054854619";
function esc(x){return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function cleanModel(v){v=String(v||"").replace(/^models\//i,""); if(v.includes("3.5")&&v.includes("lite"))return"gemini-3.5-flash-lite"; return"gemini-3.8-flash"}
function msg(t){$("status").textContent=t;$("status").style.display=t?"block":"none"}
function render(){
  $("ph").textContent=$("headline").value||"ಶೀರ್ಷಿಕೆ";$("ps").textContent=$("sub").value||"ಸಬ್‌ಹೆಡ್ಲೈನ್ ಇಲ್ಲಿ ಕಾಣಿಸುತ್ತದೆ.";
  const b=$("bodyOut").value.trim(), paras=b?b.split(/\n\s*\n/).filter(Boolean):[];
  let h=paras.map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>");
  if(photos.length){let imgs=photos.map(p=>`<figure class="post-photo"><img src="${p.dataUrl}" alt=""><figcaption>${esc(p.caption)}</figcaption></figure>`).join("");h.splice(Math.min(1,h.length),0,imgs)}
  if(keyPoints.length)h.push(`<div class="summary-box"><h3>ಪ್ರಮುಖ ಅಂಶಗಳು</h3><ul>${keyPoints.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>`);
  if(englishSummary)h.push(`<div class="summary-box english-box"><h3>English Summary</h3><p>${esc(englishSummary)}</p></div>`);
  $("pbody").innerHTML=h.join("")||"ನಿಮ್ಮ ಸುದ್ದಿ ಇಲ್ಲಿ ಕಾಣಿಸುತ್ತದೆ.";
}
["headline","sub","bodyOut"].forEach(x=>$(x).addEventListener("input",render));
$("themeBtn").onclick=()=>{let d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"light":"dark";localStorage.setItem("bn_theme",d?"light":"dark");$("themeBtn").textContent=d?"🌙 Dark":"☀️ Light"};
document.documentElement.dataset.theme=localStorage.getItem("bn_theme")||"dark";$("themeBtn").textContent=document.documentElement.dataset.theme==="dark"?"☀️ Light":"🌙 Dark";

function promptFor(task){
 const raw=$("raw").value.trim();if(!raw){msg("ಮೊದಲು Raw News ಹಾಕಿ.");return null}
 const lim=$("limit").value, date=$("style").value==="vijayavani"?"ವಿಜಯವಾಣಿ ಸುದ್ದಿಜಾಲ ಮೂಡುಬಿದಿರೆ":"ಮೂಡುಬಿದಿರೆ:";
 return `You are a senior Kannada newspaper sub-editor for Bidire News. ${task}
Use ONLY supplied facts. Never invent or guess. Preserve every supplied name, designation, date, place, number and factual detail. No invented quotes. Do not remove supplied names.
Target ${lim==="0"?"natural length":lim+" words"}. Do not cut sentences.
Return ONLY valid JSON with keys: headline, subheadline, body, keyPoints, englishSummary.
keyPoints: 3-5 concise factual Kannada points, complete sentences, based only on the supplied news.
englishSummary: concise factual English summary, based only on the supplied news.
Dateline: ${date}
RAW NEWS:
${raw}`;
}
async function gemini(text){
 const key=localStorage.getItem("bn_key"),model=cleanModel(localStorage.getItem("bn_model"));
 if(!key){msg("Settingsನಲ್ಲಿ Gemini API key ಹಾಕಿ.");return}
 msg("AI ಕೆಲಸ ಮಾಡುತ್ತಿದೆ...");
 try{
  let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text}]}],generationConfig:{responseMimeType:"application/json"}})});
  let j=await r.json();if(!r.ok)throw Error(j.error?.message||"API error");
  let t=(j.candidates?.[0]?.content?.parts?.[0]?.text||"").replace(/^```json\s*/,"").replace(/\s*```$/,""),o=JSON.parse(t);
  $("headline").value=o.headline||"";$("sub").value=o.subheadline||"";$("bodyOut").value=o.body||"";
  keyPoints=Array.isArray(o.keyPoints)?o.keyPoints.filter(Boolean):[];englishSummary=String(o.englishSummary||"").trim();render();msg("ಸುದ್ದಿ ಸಿದ್ಧವಾಗಿದೆ.");setTimeout(()=>msg(""),1200);
 }catch(e){msg("AI error: "+e.message)}
}
$("generate").onclick=()=>{let p=promptFor("Create the complete news report.");if(p)gemini(p)};
$("shorten").onclick=()=>{let p=promptFor("Shorten the news while retaining all supplied important facts and names.");if(p)gemini(p)};
$("grammar").onclick=()=>{let p=promptFor("Correct grammar and improve newspaper readability without adding facts.");if(p)gemini(p)};
$("translate").onclick=()=>{let b=$("bodyOut").value.trim();if(!b){msg("ಮೊದಲು ಸುದ್ದಿ ತಯಾರಿಸಿ.");return}let p=`Translate the following Kannada news into natural English. Preserve all names, places, dates and factual meaning. Return JSON with keys headline,subheadline,body,keyPoints,englishSummary. English Summary should be concise. NEWS:\n${b}`;gemini(p)};

function fileData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function caption(data){
 const key=localStorage.getItem("bn_key");if(!key)return"";
 try{
  const base64=data.split(",")[1],mime=(data.match(/^data:([^;]+);/)||[])[1]||"image/jpeg";
  const prompt=`Write ONE short factual Kannada newspaper photo caption using only the supplied news context and visible image. Do not invent identities or facts. News headline: ${$("headline").value}. News: ${$("bodyOut").value}`;
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cleanModel(localStorage.getItem("bn_model"))}:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:mime,data:base64}}]}]})});
  const j=await r.json();return(j.candidates?.[0]?.content?.parts?.[0]?.text||"").trim().replace(/^["“”']+|["“”']+$/g,"")
 }catch(e){return""}
}
function renderPhotos(){
 $("photoGrid").innerHTML=photos.map((p,i)=>`<div class="photo-item"><img src="${p.dataUrl}"><div class="pcap">${esc(p.caption||"Caption")}</div><div class="pname">${esc(p.name)}</div><button class="light photo-remove" data-i="${i}">Remove</button></div>`).join("");
 document.querySelectorAll(".photo-remove").forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.i,1);renderPhotos();render()});
}
$("photoInput").onchange=async e=>{
 for(const f of [...e.target.files||[]]){
  if(!f.type.startsWith("image/"))continue;
  const dataUrl=await fileData(f),p={name:f.name,dataUrl,caption:"",driveUrl:""};photos.push(p);renderPhotos();
  p.caption=await caption(dataUrl)||($("headline").value||"ಸುದ್ದಿ")+" — Bidire News";renderPhotos();render();
 }
 e.target.value="";
};

async function access(){
 if(!window.google?.accounts?.oauth2)throw Error("Google authorization load ಆಗಿಲ್ಲ. Page refresh ಮಾಡಿ.");
 const cid=$("clientId").value.trim();if(!cid)throw Error("OAuth Client ID ಹಾಕಿ.");
 tokenClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:"https://www.googleapis.com/auth/blogger https://www.googleapis.com/auth/drive.file",callback:r=>{if(r.error){pending?.reject(Error(r.error_description||r.error));return}token=r.access_token;localStorage.setItem("bn_client",cid);$("bloggerStatus").textContent="✓ Blogger connected.";pending?.resolve(token);pending=null}});
 return new Promise((resolve,reject)=>{pending={resolve,reject};tokenClient.requestAccessToken({prompt:"consent"})})
}
$("connect").onclick=async()=>{try{await access()}catch(e){$("bloggerStatus").textContent="✕ "+e.message}};
$("disconnect").onclick=()=>{token=null;$("bloggerStatus").textContent="Disconnected."};

function blob(data){let a=data.split(","),mime=(a[0].match(/data:([^;]+)/)||[])[1]||"image/jpeg",bin=atob(a[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
async function uploadDrive(p){
 const b=blob(p.dataUrl),boundary="bn_"+Date.now()+"_"+Math.random().toString(16).slice(2),meta={name:p.name,mimeType:b.type};
 const body=new Blob(["--"+boundary+"\r\n","Content-Type: application/json; charset=UTF-8\r\n\r\n",JSON.stringify(meta),"\r\n--"+boundary+"\r\n","Content-Type: "+b.type+"\r\n\r\n",b,"\r\n--"+boundary+"--\r\n"],{type:"multipart/related; boundary="+boundary});
 let r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"multipart/related; boundary="+boundary},body}),j=await r.json();
 if(!r.ok)throw Error(j.error?.message||"Drive upload failed");
 let id=j.id;
 r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}/permissions`,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({role:"reader",type:"anyone"})});
 if(!r.ok){j=await r.json().catch(()=>({}));throw Error(j.error?.message||"Drive permission failed")}
 return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`;
}
async function hostedPhotos(){
 let arr=[];for(let i=0;i<photos.length;i++){if(!photos[i].driveUrl){$("publishStatus").textContent=`ಫೋಟೋ ${i+1}/${photos.length} upload ಆಗುತ್ತಿದೆ...`;photos[i].driveUrl=await uploadDrive(photos[i])}arr.push(photos[i])}return arr;
}
function htmlContent(ph){
 const sub=$("sub").value.trim(),b=$("bodyOut").value.trim(),paras=b.split(/\n\s*\n/).filter(Boolean);
 let out=sub?`<p style="font-size:15px;font-weight:600;line-height:1.55;color:#555;padding:7px 10px;border-left:3px solid #aaa;background:#f7f7f7;">${esc(sub)}</p>`:"";
 if(paras.length)out+="<p>"+esc(paras[0]).replace(/\n/g,"<br>")+"</p>";
 ph.forEach(p=>out+=`<figure style="margin:16px 0 18px;text-align:center;"><img src="${p.driveUrl}" alt="${esc(p.caption)}" style="max-width:100%;height:auto;display:block;margin:0 auto;"><figcaption style="font-size:12px;font-style:italic;color:#666;margin-top:5px;line-height:1.4;">${esc(p.caption)}</figcaption></figure>`);
 for(let i=1;i<paras.length;i++)out+="<p>"+esc(paras[i]).replace(/\n/g,"<br>")+"</p>";
 if(keyPoints.length)out+=`<div style="margin:24px 0;padding:14px 16px;background:#fff4ef;border-left:4px solid #d71920;border-radius:4px;"><div style="font-size:20px;font-weight:700;margin-bottom:8px;">ಪ್ರಮುಖ ಅಂಶಗಳು</div><ul style="margin:0;padding-left:20px;">${keyPoints.map(x=>`<li style="margin:6px 0;line-height:1.6;">${esc(x)}</li>`).join("")}</ul></div>`;
 if(englishSummary)out+=`<div style="margin:22px 0;padding:14px 16px;background:#f7f7f7;border-left:4px solid #555;border-radius:4px;"><div style="font-size:20px;font-weight:700;margin-bottom:8px;">English Summary</div><div style="font-size:15px;line-height:1.65;color:#444;">${esc(englishSummary)}</div></div>`;
 return out;
}
$("publish").onclick=async()=>{
 const title=$("headline").value.trim(),body=$("bodyOut").value.trim(),blogId=$("blogId").value.trim()||blogDefault;
 if(!title||!body){$("publishStatus").textContent="Headline ಮತ್ತು News Body ಸಿದ್ಧಪಡಿಸಿ.";return}
 $("publishStatus").style.display="block";
 try{
  if(!token)await access();
  const ph=await hostedPhotos(),content=htmlContent(ph),labels=$("blogLabel").value.trim()?[$("blogLabel").value.trim()]:[];
  const r=await fetch(`https://www.googleapis.com/blogger/v3/blogs/${encodeURIComponent(blogId)}/posts`,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({kind:"blogger#post",blog:{id:blogId},title,content,labels,images:ph.map(p=>({url:p.driveUrl}))})});
  const j=await r.json();if(!r.ok)throw Error(j.error?.message||"Blogger API error");
  $("publishStatus").style.color="#16803c";$("publishStatus").textContent="✓ Bloggerಗೆ publish ಆಯಿತು.";
 }catch(e){$("publishStatus").style.color="#b40000";$("publishStatus").textContent="✕ Publish ಆಗಲಿಲ್ಲ: "+e.message}
};
$("copy").onclick=()=>navigator.clipboard.writeText($("headline").value+"\n\n"+$("sub").value+"\n\n"+$("bodyOut").value);
$("save").onclick=()=>{localStorage.setItem("bn_draft",JSON.stringify({headline:$("headline").value,sub:$("sub").value,body:$("bodyOut").value,keyPoints,englishSummary,photos}));msg("Draft saved.")};
$("settingsBtn").onclick=()=>{$("settings").classList.toggle("hide");$("apiKey").value=localStorage.getItem("bn_key")||"";$("model").value=cleanModel(localStorage.getItem("bn_model"));$("clientId").value=localStorage.getItem("bn_client")||"";$("blogId").value=localStorage.getItem("bn_blog")||blogDefault;$("blogLabel").value=localStorage.getItem("bn_label")||"";if(!$("settings").classList.contains("hide"))$("settings").scrollIntoView({behavior:"smooth"})};
$("saveSettings").onclick=()=>{localStorage.setItem("bn_key",$("apiKey").value.trim());localStorage.setItem("bn_model",cleanModel($("model").value));localStorage.setItem("bn_client",$("clientId").value.trim());localStorage.setItem("bn_blog",$("blogId").value.trim()||blogDefault);localStorage.setItem("bn_label",$("blogLabel").value.trim());$("settingsStatus").textContent="✓ Settings saved."};
$("newBtn").onclick=()=>{if(!confirm("ಹೊಸ Post ಆರಂಭಿಸಬೇಕೇ?"))return;$("raw").value=$("headline").value=$("sub").value=$("bodyOut").value="";photos=[];keyPoints=[];englishSummary="";renderPhotos();render();window.scrollTo({top:0,behavior:"smooth"})};
let d=JSON.parse(localStorage.getItem("bn_draft")||"null");if(d){$("headline").value=d.headline||"";$("sub").value=d.sub||"";$("bodyOut").value=d.body||"";keyPoints=d.keyPoints||[];englishSummary=d.englishSummary||"";photos=d.photos||[];renderPhotos();render()}
